pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        // Google-hosted Maven Central mirror (avoids intermittent TLS handshake
        // failures reaching repo.maven.apache.org on filtered networks)
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // UPDATE this version for compileSdk 35 compatibility
    id "com.android.application" version "8.6.0" apply false
    // You can also update the Kotlin plugin
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
}

include ":app"
