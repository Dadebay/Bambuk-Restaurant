name: bamboo
description: Bamboo Restaurant mobile ordering app for Ashgabat.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 2.0.4+14

environment:
  sdk: ">=3.6.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  iconly:
    path: packages/iconly
  hugeicons: ^0.0.11
  banner_image: ^1.0.7
  http: ^1.2.1
  cached_network_image: ^3.2.3
  flutter_slidable: ^3.0.1
  sqflite: ^2.2.2
  provider: ^6.0.4
  dio: ^5.4.0
  intl: ^0.20.2
  flutter_html: ^3.0.0-beta.2
  flutter_svg: ^2.2.0
  photo_view: ^0.14.0
  flutter_local_notifications: ^18.0.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.1.10
  firebase_core: ^3.1.1
  # awesome_notifications: ^0.10.1
  firebase_messaging: ^15.0.0
  badges: ^3.1.2
  get: ^4.7.3
  shared_preferences: ^2.5.3
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  location: ^7.0.0
  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  json_serializable: ^6.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/logo.png
    - assets/lottie/
  fonts:
    - family: Monto
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
    - family: Semi
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: GilroyBold
      fonts:
        - asset: assets/fonts/Gilroy-Bold.ttf
    - family: GilroySemiBold
      fonts:
        - asset: assets/fonts/Gilroy-SemiBold.ttf
    - family: GilroyMedium
      fonts:
        - asset: assets/fonts/Gilroy-Medium.ttf
    - family: GilroyRegular
      fonts:
        - asset: assets/fonts/Gilroy-Regular.ttf
  generate: true
